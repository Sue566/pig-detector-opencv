version: '3.8'

services:
  pig-detector-api:
    build: .
    ports:
      - "8092:8092"
    environment:
      - HOST=0.0.0.0
      - PORT=8092
    volumes:
      # 可选：挂载本地图片目录用于测试
      - ./dataset:/app/dataset:ro
      - ./temp:/app/temp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s